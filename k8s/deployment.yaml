apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobly-api
  labels:
    app: jobly-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: jobly-api
  template:
    metadata:
      labels:
        app: jobly-api
    spec:
      containers:
        - name: api
          image: jobly-api:latest
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jobly-api-service
spec:
  type: ClusterIP
  selector:
    app: jobly-api
  ports:
    - port: 80
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobly-worker
  labels:
    app: jobly-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobly-worker
  template:
    metadata:
      labels:
        app: jobly-worker
    spec:
      containers:
        - name: worker
          image: jobly-worker:latest
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 1024Mi
---
# KEDA Autoscaler scaling worker replicas based on Redis queue depth
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: jobly-worker-scaler
spec:
  scaleTargetRef:
    name: jobly-worker
  minReplicaCount: 1
  maxReplicaCount: 10
  triggers:
    - type: redis
      metadata:
        address: redis:6379
        listName: bull:resume-processing:wait
        listLength: "5"
