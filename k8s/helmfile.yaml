repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: minio
    url: https://charts.min.io/
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: kedacore
    url: https://kedacore.github.io/charts
  - name: ingress-nginx
    url: https://kubernetes.github.io/ingress-nginx
  - name: jetstack
    url: https://charts.jetstack.io

releases:
  - name: jobly-mongodb
    namespace: default
    chart: bitnami/mongodb
    version: 13.9.4
    values:
      - architecture: replicaset
      - replicaCount: 3
      - auth:
          enabled: false

  - name: jobly-redis
    namespace: default
    chart: bitnami/redis
    version: 18.0.0
    values:
      - architecture: replication
      - auth:
          enabled: false

  - name: jobly-minio
    namespace: default
    chart: minio/minio
    version: 5.0.9
    values:
      - rootUser: minioadmin
      - rootPassword: minioadmin
      - persistence:
          size: 50Gi

  - name: ingress-nginx
    namespace: ingress-nginx
    chart: ingress-nginx/ingress-nginx
    version: 4.8.0
    createNamespace: true
    values:
      - controller:
          metrics:
            enabled: true

  - name: cert-manager
    namespace: cert-manager
    chart: jetstack/cert-manager
    version: v1.13.0
    createNamespace: true
    set:
      - name: installCRDs
        value: "true"

  - name: keda
    namespace: keda
    chart: kedacore/keda
    version: 2.11.2
    createNamespace: true

  - name: kube-prometheus-stack
    namespace: monitoring
    chart: prometheus-community/kube-prometheus-stack
    version: 51.2.0
    createNamespace: true
