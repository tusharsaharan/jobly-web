apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobly-worker
  labels:
    app: jobly-worker
spec:
  # Replicas managed by KEDA ScaledObject
  selector:
    matchLabels:
      app: jobly-worker
  template:
    metadata:
      labels:
        app: jobly-worker
    spec:
      containers:
        - name: worker
          image: jobly-worker:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: jobly-config
            - secretRef:
                name: jobly-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
