apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobly-web
  labels:
    app: jobly-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jobly-web
  template:
    metadata:
      labels:
        app: jobly-web
    spec:
      containers:
        - name: web
          image: jobly-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: jobly-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
